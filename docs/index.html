<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>DIGI-FEED | 디지몬 실시간 모니터</title>
  
  <!-- PWA Meta -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#f97316">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="디지피드">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#fff7ed',
              500: '#f97316',
              600: '#ea580c',
            }
          }
        }
      }
    }
  </script>
  <style>
    /* iOS Safe Area & Touch */
    :root {
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
    }
    body {
      padding-top: var(--sat);
      padding-bottom: var(--sab);
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    .touch-press:active {
      transform: scale(0.97);
      transition: transform 0.1s ease;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 dark:bg-slate-950 dark:text-slate-100 min-h-screen flex flex-col font-sans transition-colors duration-200">

  <!-- Top Sticky Navigation Bar -->
  <header class="sticky top-0 z-40 bg-white/95 dark:bg-slate-950/95 backdrop-blur-md border-b border-slate-200 dark:border-slate-800/80 px-4 h-14 flex items-center justify-between transition-colors">
    <div class="flex items-center gap-2.5">
      <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-orange-600 to-amber-500 flex items-center justify-center text-lg shadow-md shadow-orange-500/20">
        👾
      </div>
      <div>
        <h1 class="font-black text-base tracking-wider text-orange-500 flex items-center gap-1.5">
          DIGI-FEED
        </h1>
      </div>
    </div>

    <!-- Quick Actions (Theme & Refresh) -->
    <div class="flex items-center gap-1.5">
      <button id="theme-btn" onclick="toggleTheme()" class="touch-press p-2 rounded-xl text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-100 bg-slate-200/60 dark:bg-slate-900 border border-slate-300/60 dark:border-slate-800 transition" title="테마 변경">
        <span id="theme-icon">🌙</span>
      </button>
      <button onclick="fetchFeeds(true)" class="touch-press flex items-center gap-1 px-3 py-1.5 rounded-xl bg-orange-500 hover:bg-orange-600 text-white font-bold text-xs shadow-md shadow-orange-500/20 transition">
        <svg id="refresh-icon" class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
        <span>새로고침</span>
      </button>
    </div>
  </header>

  <!-- Main Container -->
  <main class="flex-1 max-w-4xl w-full mx-auto px-3 sm:px-4 py-3 space-y-3 pb-20">

    <!-- Search Input -->
    <div class="relative">
      <svg class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 dark:text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
      <input 
        type="search" 
        id="search-input" 
        oninput="handleSearch(this.value)"
        placeholder="디지몬, 피규어, 카드, 굿즈 검색..." 
        class="w-full pl-10 pr-9 py-2.5 text-sm rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 focus:outline-none focus:border-orange-500 text-slate-900 dark:text-slate-100 placeholder:text-slate-400 dark:placeholder:text-slate-500 transition shadow-sm"
      />
      <button id="clear-search-btn" onclick="clearSearch()" class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-700 dark:hover:text-white p-1 text-xs">✕</button>
    </div>

    <!-- Filter Bar: Category Chips -->
    <div class="flex items-center gap-1.5 overflow-x-auto pb-1 no-scrollbar text-xs font-medium">
      <button onclick="setCategory('all')" class="cat-chip touch-press px-3.5 py-2 rounded-xl transition bg-orange-500 text-white font-bold shrink-0 shadow-sm" data-cat="all">전체</button>
      <button onclick="setCategory('sns')" class="cat-chip touch-press px-3.5 py-2 rounded-xl transition bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-800 hover:border-slate-300 dark:hover:border-slate-700 shrink-0" data-cat="sns">📱 SNS/해외</button>
      <button onclick="setCategory('figure')" class="cat-chip touch-press px-3.5 py-2 rounded-xl transition bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-800 hover:border-slate-300 dark:hover:border-slate-700 shrink-0" data-cat="figure">🧸 피규어/굿즈</button>
      <button onclick="setCategory('card')" class="cat-chip touch-press px-3.5 py-2 rounded-xl transition bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-800 hover:border-slate-300 dark:hover:border-slate-700 shrink-0" data-cat="card">🃏 카드게임(TCG)</button>
      <button onclick="setCategory('game')" class="cat-chip touch-press px-3.5 py-2 rounded-xl transition bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-800 hover:border-slate-300 dark:hover:border-slate-700 shrink-0" data-cat="game">🎮 게임/애니</button>
      <button onclick="setCategory('community')" class="cat-chip touch-press px-3.5 py-2 rounded-xl transition bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-800 hover:border-slate-300 dark:hover:border-slate-700 shrink-0" data-cat="community">🔥 커뮤니티</button>
      <button onclick="toggleBookmarkFilter()" id="bookmark-filter-btn" class="cat-chip touch-press px-3.5 py-2 rounded-xl transition bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-800 shrink-0 flex items-center gap-1 ml-auto">
        <span>⭐ 스크랩</span>
      </button>
    </div>

    <!-- Period Selection Toolbar (직접 기간 설정) -->
    <div class="flex items-center justify-between text-xs px-1 py-1 bg-white/60 dark:bg-slate-900/40 rounded-xl border border-slate-200/80 dark:border-slate-800/60">
      <div class="flex items-center gap-1 text-[11px] text-slate-500 dark:text-slate-400 font-medium pl-1">
        <span>📅 기간:</span>
      </div>
      <div class="flex items-center gap-1">
        <button onclick="setPeriod(7)" class="period-btn touch-press px-2.5 py-1 rounded-lg text-[11px] font-semibold transition" data-period="7">7일</button>
        <button onclick="setPeriod(14)" class="period-btn touch-press px-2.5 py-1 rounded-lg text-[11px] font-semibold transition" data-period="14">14일</button>
        <button onclick="setPeriod(30)" class="period-btn touch-press px-2.5 py-1 rounded-lg text-[11px] font-semibold transition bg-orange-500 text-white" data-period="30">30일</button>
        <button onclick="setPeriod(90)" class="period-btn touch-press px-2.5 py-1 rounded-lg text-[11px] font-semibold transition" data-period="90">90일</button>
      </div>
    </div>

    <!-- Status Info Bar -->
    <div class="flex items-center justify-between text-[11px] text-slate-500 dark:text-slate-400 px-1 pt-0.5">
      <div class="flex items-center gap-1.5">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        <span id="last-updated-text">최신순 정렬됨</span>
      </div>
      <div id="item-count-text" class="font-medium">0건 표시 중</div>
    </div>

    <!-- Feeds List -->
    <div id="cards-container" class="space-y-3 sm:space-y-3.5">
      <!-- Loading Skeleton Cards -->
      <div class="p-4 rounded-2xl bg-white dark:bg-slate-900/60 border border-slate-200 dark:border-slate-800/80 animate-pulse h-28"></div>
      <div class="p-4 rounded-2xl bg-white dark:bg-slate-900/60 border border-slate-200 dark:border-slate-800/80 animate-pulse h-28"></div>
    </div>

  </main>

  <!-- Floating Scroll-To-Top Button -->
  <button id="scroll-top-btn" onclick="scrollToTop()" class="hidden fixed bottom-6 right-5 w-11 h-11 rounded-full bg-orange-500/90 hover:bg-orange-500 text-white shadow-xl backdrop-blur flex items-center justify-center transition active:scale-95 z-30">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 10l7-7m0 0l7 7m-7-7v18"/></svg>
  </button>

  <!-- PWA Install Prompt Banner -->
  <div id="pwa-banner" class="hidden fixed bottom-4 left-4 right-4 max-w-sm mx-auto p-3.5 rounded-2xl bg-orange-600 text-white shadow-2xl flex items-center justify-between z-50">
    <div class="text-xs">
      <p class="font-extrabold text-[13px]">홈 화면에 앱으로 추가</p>
      <p class="text-orange-100 text-[11px] mt-0.5">주소창 없이 전체화면으로 빠르게 확인하세요.</p>
    </div>
    <div class="flex items-center gap-1.5 shrink-0">
      <button onclick="installPwa()" class="px-3 py-1.5 bg-white text-orange-600 font-bold text-xs rounded-xl shadow-sm">추가</button>
      <button onclick="dismissPwaBanner()" class="p-1.5 text-orange-200 hover:text-white">✕</button>
    </div>
  </div>

  <script>
    let feeds = [];
    let currentCategory = 'all';
    let searchQuery = '';
    let showOnlyBookmarks = false;
    let selectedPeriodDays = parseInt(localStorage.getItem('digi_period') || '30', 10);
    let deferredPrompt = null;

    // Theme Management
    function initTheme() {
      const savedTheme = localStorage.getItem('digi_theme') || 'dark';
      applyTheme(savedTheme);
    }

    function applyTheme(theme) {
      const html = document.documentElement;
      const icon = document.getElementById('theme-icon');
      if (theme === 'dark') {
        html.classList.add('dark');
        if (icon) icon.textContent = '🌙';
      } else {
        html.classList.remove('dark');
        if (icon) icon.textContent = '☀️';
      }
      localStorage.setItem('digi_theme', theme);
    }

    function toggleTheme() {
      const isDark = document.documentElement.classList.contains('dark');
      applyTheme(isDark ? 'light' : 'dark');
      renderCards(); // Re-render cards for theme classes
    }

    // Relative Time Formatter
    function formatRelativeTime(ts, dateStr) {
      if (!ts) return dateStr || '';
      const now = Math.floor(Date.now() / 1000);
      const diff = now - ts;

      if (diff < 60) return '방금 전';
      if (diff < 3600) return `${Math.floor(diff / 60)}분 전`;
      if (diff < 86400) return `${Math.floor(diff / 3600)}시간 전`;
      if (diff < 86400 * 2) return '어제';
      if (diff < 86400 * 7) return `${Math.floor(diff / 86400)}일 전`;
      
      return dateStr ? dateStr.split(' ')[0] : `${Math.floor(diff / 86400)}일 전`;
    }

    // Bookmarks LocalStorage
    function getBookmarks() {
      try {
        return JSON.parse(localStorage.getItem('digi_bookmarks') || '[]');
      } catch (e) {
        return [];
      }
    }

    function saveBookmarks(bks) {
      localStorage.setItem('digi_bookmarks', JSON.stringify(bks));
    }

    function toggleBookmark(id, event) {
      if (event) event.stopPropagation();
      let bks = getBookmarks();
      if (bks.includes(id)) {
        bks = bks.filter(x => x !== id);
      } else {
        bks.push(id);
      }
      saveBookmarks(bks);
      renderCards();
    }

    // Period Filter
    function setPeriod(days) {
      selectedPeriodDays = days;
      localStorage.setItem('digi_period', days);
      updatePeriodButtons();
      renderCards();
    }

    function updatePeriodButtons() {
      document.querySelectorAll('.period-btn').forEach(btn => {
        const p = parseInt(btn.getAttribute('data-period'), 10);
        if (p === selectedPeriodDays) {
          btn.className = "period-btn touch-press px-2.5 py-1 rounded-lg text-[11px] font-semibold transition bg-orange-500 text-white shadow-sm";
        } else {
          btn.className = "period-btn touch-press px-2.5 py-1 rounded-lg text-[11px] font-semibold transition text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white";
        }
      });
    }

    // Fetch Feeds
    async function fetchFeeds(isManual = false) {
      const icon = document.getElementById('refresh-icon');
      if (icon) icon.classList.add('animate-spin');

      try {
        const res = await fetch(`digimon_feeds.json?t=${Date.now()}`);
        if (!res.ok) throw new Error("Feeds load error");
        const data = await res.json();
        
        // 최신순 정렬 보장
        feeds = (data.feeds || []).sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

        document.getElementById('last-updated-text').textContent = `최근 갱신: ${data.last_updated || '방금 전'}`;
        renderCards();
      } catch (err) {
        console.error(err);
        document.getElementById('last-updated-text').textContent = "피드 로드 실패 (새로고침을 눌러보세요)";
      } finally {
        if (icon) setTimeout(() => icon.classList.remove('animate-spin'), 400);
      }
    }

    // Title Cleaner (불필요한 중복 말머리 태그 제거)
    function cleanTitle(rawTitle) {
      if (!rawTitle) return '';
      return rawTitle
        .replace(/^\[(r\/digimon|r\/디지카|트윗|영상|해외공식|국내공식|뉴스)\]\s*/i, '')
        .replace(/^【[^】]+】\s*/, '')
        .trim();
    }

    // Render Cards (모바일 매거진/소셜 피드 스타일 풀와이드 카드)
    function renderCards() {
      const container = document.getElementById('cards-container');
      const bks = getBookmarks();
      const nowTs = Math.floor(Date.now() / 1000);
      const periodSeconds = selectedPeriodDays * 86400;

      const filtered = feeds.filter(item => {
        // 1. 기간 필터
        if (item.timestamp && (nowTs - item.timestamp > periodSeconds)) {
          return false;
        }

        // 2. 카테고리 필터
        let matchesCat = false;
        if (currentCategory === 'all') {
          matchesCat = true;
        } else if (currentCategory === 'sns') {
          matchesCat = ['레딧', 'X(트위터)', '유튜브', '공식/글로벌'].includes(item.source_badge);
        } else {
          matchesCat = item.category === currentCategory;
        }

        // 3. 검색어 필터
        const matchesSearch = !searchQuery || 
                              item.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                              (item.snippet && item.snippet.toLowerCase().includes(searchQuery.toLowerCase()));

        // 4. 북마크 필터
        const isBked = bks.includes(item.id);
        const matchesBk = !showOnlyBookmarks || isBked;

        return matchesCat && matchesSearch && matchesBk;
      });

      document.getElementById('item-count-text').textContent = `최근 ${selectedPeriodDays}일 · ${filtered.length}건`;

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="py-16 text-center text-slate-500 bg-white dark:bg-slate-900/40 rounded-2xl border border-slate-200 dark:border-slate-800/60 p-6 shadow-sm">
            <div class="text-4xl mb-2">🔍</div>
            <p class="font-bold text-sm text-slate-700 dark:text-slate-300">해당 조건의 소식이 없습니다.</p>
            <p class="text-xs mt-1 text-slate-400">기간을 더 늘려보거나 다른 카테고리를 눌러보세요.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(item => {
        const isBked = bks.includes(item.id);
        const relativeTime = formatRelativeTime(item.timestamp, item.created_at);
        const displayTitle = cleanTitle(item.title);

        const badgeStyle = item.source_badge === '루리웹' 
          ? 'bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 border-emerald-500/30'
          : item.source_badge === '디시'
          ? 'bg-purple-500/10 text-purple-600 dark:text-purple-400 border-purple-500/30'
          : item.source_badge === '레딧'
          ? 'bg-cyan-500/10 text-cyan-600 dark:text-cyan-400 border-cyan-500/30'
          : item.source_badge === 'X(트위터)'
          ? 'bg-sky-500/10 text-sky-600 dark:text-sky-400 border-sky-500/30'
          : item.source_badge === '유튜브'
          ? 'bg-rose-500/10 text-rose-600 dark:text-rose-400 border-rose-500/30'
          : item.source_badge === '공식/글로벌'
          ? 'bg-blue-500/10 text-blue-600 dark:text-blue-400 border-blue-500/30'
          : 'bg-amber-500/10 text-amber-600 dark:text-amber-400 border-amber-500/30';

        return `
          <article 
            onclick="window.open('${item.link}', '_blank', 'noopener,noreferrer')" 
            class="touch-press cursor-pointer bg-white dark:bg-slate-900 border border-slate-200/90 dark:border-slate-800/90 hover:border-orange-500/50 dark:hover:border-orange-500/50 rounded-2xl p-4 sm:p-5 shadow-sm hover:shadow-md transition-all duration-150 flex flex-col justify-between group relative"
          >
            <!-- Card Header: Source badge + Time & Big Bookmark button -->
            <div class="flex items-center justify-between gap-2 mb-1.5">
              <div class="flex items-center gap-2 flex-wrap">
                <span class="text-[11px] font-bold px-2.5 py-0.5 rounded-lg border ${badgeStyle}">${item.source_badge || item.source}</span>
                <span class="text-xs font-medium text-slate-500 dark:text-slate-400">${item.source || ''}</span>
                <span class="text-slate-300 dark:text-slate-700">·</span>
                <span class="text-xs font-semibold text-orange-600 dark:text-orange-400">${relativeTime}</span>
              </div>
              <button 
                onclick="toggleBookmark('${item.id}', event)" 
                class="touch-press p-2 -mr-2 text-lg text-slate-400 hover:text-amber-500 active:scale-125 transition"
                title="스크랩 저장"
              >
                ${isBked ? '⭐' : '☆'}
              </button>
            </div>

            <!-- Big Clear Title -->
            <h2 class="font-extrabold text-[16px] sm:text-[18px] leading-snug text-slate-900 dark:text-slate-100 group-hover:text-orange-600 dark:group-hover:text-orange-400 transition tracking-tight my-1">
              ${displayTitle}
            </h2>

            <!-- Full-Width Media Image (Instagram/YouTube style) -->
            ${item.image ? `
              <div class="w-full aspect-video sm:aspect-[21/9] rounded-xl overflow-hidden bg-slate-100 dark:bg-slate-800 my-2.5 border border-slate-200/60 dark:border-slate-800/60 relative">
                <img src="${item.image}" alt="${displayTitle}" class="w-full h-full object-cover group-hover:scale-[1.02] transition duration-300" loading="lazy" />
              </div>
            ` : ''}

            <!-- Snippet Text -->
            ${item.snippet ? `
              <p class="text-[13px] sm:text-sm text-slate-600 dark:text-slate-400 leading-relaxed line-clamp-2 my-1">
                ${item.snippet}
              </p>
            ` : ''}

            <!-- Card Footer: Category & Open Link -->
            <div class="mt-3 pt-2.5 border-t border-slate-100 dark:border-slate-800/80 flex items-center justify-between text-xs text-slate-400">
              <span class="text-slate-400">카테고리: <strong class="text-slate-600 dark:text-slate-300 font-semibold">${item.category_name || '일반'}</strong></span>
              <span class="font-bold text-orange-600 dark:text-orange-400 flex items-center gap-1 group-hover:translate-x-0.5 transition">
                원문 보기
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"/></svg>
              </span>
            </div>
          </article>
        `;
      }).join('');
    }

    function setCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.cat-chip').forEach(btn => {
        if (btn.getAttribute('data-cat') === cat) {
          btn.className = "cat-chip touch-press px-3.5 py-2 rounded-xl transition bg-orange-500 text-white font-bold shrink-0 shadow-sm";
        } else if (btn.id !== 'bookmark-filter-btn') {
          btn.className = "cat-chip touch-press px-3.5 py-2 rounded-xl transition bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-800 hover:border-slate-300 dark:hover:border-slate-700 shrink-0";
        }
      });
      renderCards();
    }

    function handleSearch(val) {
      searchQuery = val.trim();
      const clearBtn = document.getElementById('clear-search-btn');
      if (searchQuery) {
        clearBtn.classList.remove('hidden');
      } else {
        clearBtn.classList.add('hidden');
      }
      renderCards();
    }

    function clearSearch() {
      const input = document.getElementById('search-input');
      input.value = '';
      handleSearch('');
      input.focus();
    }

    function toggleBookmarkFilter() {
      showOnlyBookmarks = !showOnlyBookmarks;
      const btn = document.getElementById('bookmark-filter-btn');
      if (showOnlyBookmarks) {
        btn.className = "cat-chip touch-press px-3.5 py-2 rounded-xl transition bg-amber-500 text-slate-950 font-bold shrink-0 flex items-center gap-1 ml-auto shadow-md shadow-amber-500/20";
        btn.innerHTML = "<span>⭐ 스크랩됨</span>";
      } else {
        btn.className = "cat-chip touch-press px-3.5 py-2 rounded-xl transition bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-800 shrink-0 flex items-center gap-1 ml-auto";
        btn.innerHTML = "<span>⭐ 스크랩</span>";
      }
      renderCards();
    }

    // Scroll to Top
    window.addEventListener('scroll', () => {
      const topBtn = document.getElementById('scroll-top-btn');
      if (window.scrollY > 250) {
        topBtn.classList.remove('hidden');
      } else {
        topBtn.classList.add('hidden');
      }
    });

    function scrollToTop() {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // PWA Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(console.error);
      });
    }

    // PWA Install Prompt
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById('pwa-banner').classList.remove('hidden');
    });

    function installPwa() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(() => {
          deferredPrompt = null;
          dismissPwaBanner();
        });
      }
    }

    function dismissPwaBanner() {
      document.getElementById('pwa-banner').classList.add('hidden');
    }

    // Initialize App
    initTheme();
    updatePeriodButtons();
    fetchFeeds();
  </script>
</body>
</html>
