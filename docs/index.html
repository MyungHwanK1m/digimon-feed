<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>DIGI-FEED | 디지몬 테이머즈 블루 카드</title>
  
  <!-- PWA Meta & Security Policies -->
  <meta name="referrer" content="no-referrer">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#004ce8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="디지피드">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            bluecard: {
              300: '#60a5fa',
              400: '#38bdf8',
              500: '#0052ff',
              600: '#0047e0',
              700: '#0037b3',
              800: '#0b1940',
              900: '#050b1a',
              950: '#02050e',
            }
          }
        }
      }
    }
  </script>
  <style>
    /* iOS Safe Area & Touch */
    :root {
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
    }
    body {
      padding-top: var(--sat);
      padding-bottom: var(--sab);
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    .touch-press:active {
      transform: scale(0.97);
      transition: transform 0.1s ease;
    }

    /* Cyber Matrix Grid Background (디지털 월드 그리드 패턴) */
    .dark .cyber-grid-bg {
      background-color: #040817;
      background-image: 
        radial-gradient(rgba(0, 102, 255, 0.15) 1px, transparent 1px),
        linear-gradient(to right, rgba(0, 82, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 82, 255, 0.03) 1px, transparent 1px);
      background-size: 24px 24px, 48px 48px, 48px 48px;
    }
    .cyber-grid-bg {
      background-color: #f1f5fd;
      background-image: 
        radial-gradient(rgba(0, 82, 255, 0.12) 1px, transparent 1px),
        linear-gradient(to right, rgba(0, 82, 255, 0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 82, 255, 0.04) 1px, transparent 1px);
      background-size: 24px 24px, 48px 48px, 48px 48px;
    }

    /* Blue Card Slash Glow */
    .blue-card-item {
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .blue-card-item:hover, .blue-card-item:active {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px -5px rgba(0, 76, 232, 0.35), 0 0 15px 0 rgba(250, 204, 21, 0.2);
    }

    /* Dot Matrix Watermark */
    .dot-matrix-watermark {
      background-image: radial-gradient(#facc15 1.5px, transparent 1.5px);
      background-size: 9px 9px;
      opacity: 0.14;
    }

    /* V-Pet Dot Matrix Retro LCD Screen */
    .lcd-screen {
      background-color: #0b1a13;
      background-image: 
        linear-gradient(rgba(16, 185, 129, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(16, 185, 129, 0.08) 1px, transparent 1px);
      background-size: 5px 5px;
      box-shadow: inset 0 0 25px rgba(0, 0, 0, 0.85), 0 0 15px rgba(16, 185, 129, 0.2);
      image-rendering: pixelated;
    }
  </style>
</head>
<body class="cyber-grid-bg text-slate-800 dark:text-slate-100 min-h-screen flex flex-col font-sans transition-colors duration-200">

  <!-- D-Ark Slash Header (블루 카드 테마) -->
  <header class="sticky top-0 z-40 bg-white/90 dark:bg-[#050b1a]/90 backdrop-blur-lg border-b border-blue-500/20 dark:border-blue-500/30 px-4 h-14 flex items-center justify-between shadow-sm">
    <div onclick="goHome()" class="flex items-center gap-3 cursor-pointer select-none group touch-press" title="홈으로 이동 (초기화)">
      <!-- Tamers Blue Card Realistic Emblem -->
      <div class="w-7 h-10 rounded-md bg-[#004ce8] border border-blue-300 shadow-md shadow-blue-600/40 flex items-center justify-center relative overflow-hidden shrink-0 group-hover:scale-105 transition">
        <!-- Magnetic Stripe (Left) -->
        <div class="absolute left-0 top-0 bottom-0 w-1.5 bg-slate-800 border-r border-slate-900"></div>
        <!-- Dot Matrix + Wing Icon -->
        <svg class="w-4 h-4 ml-1" viewBox="0 0 24 24" fill="none">
          <circle cx="9" cy="9" r="1.2" fill="#facc15" />
          <circle cx="13" cy="9" r="1.2" fill="#facc15" />
          <circle cx="17" cy="9" r="1.2" fill="#facc15" />
          <circle cx="9" cy="13" r="1.2" fill="#facc15" />
          <circle cx="13" cy="13" r="1.2" fill="#facc15" />
          <circle cx="17" cy="13" r="1.2" fill="#facc15" />
          <circle cx="9" cy="17" r="1.2" fill="#facc15" />
          <circle cx="13" cy="17" r="1.2" fill="#facc15" />

          <path d="M11 8L18 6L16 11L20 12L15 17L12 14L10 16L11 8Z" fill="#581c87" stroke="#c084fc" stroke-width="0.7"/>
        </svg>
      </div>

      <div>
        <h1 class="font-black text-base tracking-widest text-[#004ce8] dark:text-blue-400 flex items-center gap-1.5 drop-shadow-sm group-hover:text-blue-600 dark:group-hover:text-blue-300 transition">
          DIGI-FEED

        </h1>

    <!-- Quick Actions (Theme & Slash Refresh) -->
    <div class="flex items-center gap-2">
      <button id="theme-btn" onclick="toggleTheme()" class="touch-press p-2 rounded-xl text-blue-700 dark:text-blue-300 hover:text-blue-900 dark:hover:text-white bg-blue-50 dark:bg-blue-950/60 border border-blue-200 dark:border-blue-800/80 transition" title="테마 변경">
        <span id="theme-icon">🌙</span>
      </button>
      <button onclick="fetchFeeds(true)" class="touch-press flex items-center gap-1.5 px-3.5 py-1.5 rounded-xl bg-[#004ce8] hover:bg-blue-600 text-white font-extrabold text-xs shadow-md shadow-blue-600/30 transition">
        <svg id="refresh-icon" class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>

  <!-- View Switcher (Feed vs Digi-Dex) -->

    <!-- 1. Live Feeds Section -->

        <button onclick="setCategory('figure')" class="cat-chip touch-press px-3.5 py-2 rounded-xl transition bg-white/90 dark:bg-[#070e22]/90 text-slate-700 dark:text-slate-300 border border-blue-200 dark:border-blue-900/60 hover:border-blue-400 shrink-0 shadow-xs" data-cat="figure">🧸 피규어/굿즈</button>
        <button onclick="setCategory('card')" class="cat-chip touch-press px-3.5 py-2 rounded-xl transition bg-white/90 dark:bg-[#070e22]/90 text-slate-700 dark:text-slate-300 border border-blue-200 dark:border-blue-900/60 hover:border-blue-400 shrink-0 shadow-xs" data-cat="card">🃏 카드게임(TCG)</button>

  <!-- Floating Scroll-To-Top Button (Blue Card Sphere) -->

  </button>

  <!-- PWA Install Prompt Banner (Blue Card Slash Edition) -->
  <div id="pwa-banner" class="hidden fixed bottom-4 left-4 right-4 max-w-sm mx-auto p-4 rounded-2xl bg-gradient-to-r from-[#004ce8] to-[#1e1b4b] text-white shadow-2xl flex items-center justify-between z-50 border-2 border-blue-300/40 shadow-blue-600/40">

      <p class="text-blue-100 text-[11px] mt-0.5 font-medium">홈 화면에 블루 카드 앱을 설치하세요.</p>

    <div class="flex items-center gap-1.5 shrink-0">
      <button onclick="installPwa()" class="px-3.5 py-1.5 bg-yellow-400 text-slate-950 font-black text-xs rounded-xl shadow-sm">설치</button>
      <button onclick="dismissPwaBanner()" class="p-1.5 text-blue-200 hover:text-white">✕</button>
    </div>
  </div>

  <script>
    let feeds = [];
    let currentCategory = 'all';
    let searchQuery = '';
    let showOnlyBookmarks = false;
    let selectedPeriodDays = parseInt(localStorage.getItem('digi_period') || '30', 10);
    let deferredPrompt = null;

    // Theme Management
    function initTheme() {
      const savedTheme = localStorage.getItem('digi_theme') || 'dark';
      applyTheme(savedTheme);
    }

    function applyTheme(theme) {
      const html = document.documentElement;
      const icon = document.getElementById('theme-icon');
      if (theme === 'dark') {
        html.classList.add('dark');
        if (icon) icon.textContent = '🌙';
      } else {
        html.classList.remove('dark');
        if (icon) icon.textContent = '☀️';
      }
      localStorage.setItem('digi_theme', theme);
    }

    function toggleTheme() {
      const isDark = document.documentElement.classList.contains('dark');
      applyTheme(isDark ? 'light' : 'dark');
      renderCards();
    }

    // Relative Time Formatter
    function formatRelativeTime(ts, dateStr) {
      if (!ts) return dateStr || '';
      const now = Math.floor(Date.now() / 1000);
      const diff = now - ts;

      if (diff < 60) return '방금 전';
      if (diff < 3600) return `${Math.floor(diff / 60)}분 전`;
      if (diff < 86400) return `${Math.floor(diff / 3600)}시간 전`;
      if (diff < 86400 * 2) return '어제';
      if (diff < 86400 * 7) return `${Math.floor(diff / 86400)}일 전`;
      
      return dateStr ? dateStr.split(' ')[0] : `${Math.floor(diff / 86400)}일 전`;
    }

    // Title Cleaner
    function cleanTitle(rawTitle) {
      if (!rawTitle) return '';
      return rawTitle
        .replace(/^\[(r\/digimon|r\/디지카|트윗|영상|해외공식|국내공식|뉴스)\]\s*/i, '')
        .replace(/^【[^】]+】\s*/, '')
        .trim();
    }

    // Bookmarks LocalStorage
    function getBookmarks() {
      try {
        return JSON.parse(localStorage.getItem('digi_bookmarks') || '[]');
      } catch (e) {
        return [];
      }
    }

    function saveBookmarks(bks) {
      localStorage.setItem('digi_bookmarks', JSON.stringify(bks));
    }

    function toggleBookmark(id, event) {
      if (event) event.stopPropagation();
      let bks = getBookmarks();
      if (bks.includes(id)) {
        bks = bks.filter(x => x !== id);
      } else {
        bks.push(id);
      }
      saveBookmarks(bks);
      renderCards();
    }

    // Period Filter
    function setPeriod(days) {
      selectedPeriodDays = days;
      localStorage.setItem('digi_period', days);
      updatePeriodButtons();
      renderCards();
    }

    function updatePeriodButtons() {
      document.querySelectorAll('.period-btn').forEach(btn => {
        const p = parseInt(btn.getAttribute('data-period'), 10);
        if (p === selectedPeriodDays) {
          btn.className = "period-btn touch-press px-2.5 py-1 rounded-lg text-[11px] font-bold transition bg-[#004ce8] text-white shadow-xs";
        } else {
          btn.className = "period-btn touch-press px-2.5 py-1 rounded-lg text-[11px] font-bold transition text-slate-600 dark:text-slate-400 hover:text-[#004ce8] dark:hover:text-blue-300";
        }
      });
    }

    // Fetch Feeds
    async function fetchFeeds(isManual = false) {
      const icon = document.getElementById('refresh-icon');
      if (icon) icon.classList.add('animate-spin');

      try {
        const res = await fetch(`digimon_feeds.json?t=${Date.now()}`);
        if (!res.ok) throw new Error("Feeds load error");
        const data = await res.json();
        
        feeds = (data.feeds || []).sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

        document.getElementById('last-updated-text').textContent = `최근 갱신: ${data.last_updated || '방금 전'}`;
        renderCards();
      } catch (err) {
        console.error(err);
        document.getElementById('last-updated-text').textContent = "피드 로드 실패 (슬래시를 눌러보세요)";
      } finally {
        if (icon) setTimeout(() => icon.classList.remove('animate-spin'), 400);
      }
    }

    // Render Cards: 'Real Blue Card' Form Factor
    function renderCards() {
      const container = document.getElementById('cards-container');
      const bks = getBookmarks();
      const nowTs = Math.floor(Date.now() / 1000);
      const periodSeconds = selectedPeriodDays * 86400;

      const filtered = feeds.filter(item => {
        if (item.timestamp && (nowTs - item.timestamp > periodSeconds)) {
          return false;
        }

        let matchesCat = false;
        if (currentCategory === 'all') {
          matchesCat = true;
        } else if (currentCategory === 'sns') {
          matchesCat = item.category === 'sns' || ['레딧', 'X(트위터)', '유튜브', '공식/글로벌'].includes(item.source_badge);
        } else {
          matchesCat = item.category === currentCategory;
        }

        const matchesSearch = !searchQuery || 
                              item.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                              (item.snippet && item.snippet.toLowerCase().includes(searchQuery.toLowerCase()));

        const isBked = bks.includes(item.id);
        const matchesBk = !showOnlyBookmarks || isBked;

        return matchesCat && matchesSearch && matchesBk;
      });

      document.getElementById('item-count-text').textContent = `${filtered.length} ENTRIES`;

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="py-16 text-center text-slate-500 bg-white/80 dark:bg-[#070e22]/80 backdrop-blur rounded-2xl border border-blue-200 dark:border-blue-900/60 p-6 shadow-sm">
            <div class="text-4xl mb-2">🃏</div>
            <p class="font-extrabold text-sm text-slate-800 dark:text-slate-200">데이터가 없습니다.</p>
            <p class="text-xs mt-1 text-slate-500">기간을 더 늘려보거나 다른 탭을 눌러보세요.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(item => {
        const isBked = bks.includes(item.id);
        const relativeTime = formatRelativeTime(item.timestamp, item.created_at);
        const displayTitle = cleanTitle(item.title);

        const badgeStyle = item.source_badge === '루리웹' 
          ? 'bg-emerald-500/15 text-emerald-600 dark:text-emerald-400 border-emerald-500/40'
          : item.source_badge === '디시'
          ? 'bg-purple-500/15 text-purple-600 dark:text-purple-400 border-purple-500/40'
          : item.source_badge === '레딧'
          ? 'bg-cyan-500/15 text-cyan-600 dark:text-cyan-400 border-cyan-500/40'
          : item.source_badge === 'X(트위터)'
          ? 'bg-sky-500/15 text-sky-600 dark:text-sky-400 border-sky-500/40'
          : item.source_badge === '유튜브'
          ? 'bg-rose-500/15 text-rose-600 dark:text-rose-400 border-rose-500/40'
          : item.source_badge === '공식/글로벌'
          ? 'bg-blue-500/15 text-blue-600 dark:text-blue-400 border-blue-500/40'
          : 'bg-amber-500/15 text-amber-600 dark:text-amber-400 border-amber-500/40';

        return `
          <article 
            onclick="window.open('${item.link}', '_blank', 'noopener,noreferrer')" 
            class="blue-card-item touch-press cursor-pointer bg-white/95 dark:bg-[#070e22]/95 border-2 border-blue-200/90 dark:border-blue-900/70 hover:border-[#004ce8] dark:hover:border-blue-400 rounded-2xl p-4 sm:p-5 shadow-sm relative overflow-hidden flex flex-col justify-between group"
          >
            <!-- Blue Card Signature: Left Magnetic Stripe -->
            <div class="absolute left-0 top-0 bottom-0 w-2 sm:w-2.5 bg-slate-800 dark:bg-slate-700 border-r border-slate-900/80"></div>

            <!-- Blue Card Watermark: Dot Matrix in Top-Right -->
            <div class="absolute top-2 right-2 w-20 h-20 dot-matrix-watermark rounded-tr-xl pointer-events-none"></div>

            <div class="pl-2">
              <!-- Card Header -->
              <div class="flex items-center justify-between gap-2 mb-2">
                <div class="flex items-center gap-2 flex-wrap">
                  <span class="text-[10px] font-black px-2 py-0.5 rounded-md border ${badgeStyle} tracking-wider font-mono">${item.source_badge || item.source}</span>
                  <span class="text-xs font-semibold text-slate-500 dark:text-slate-400">${item.source || ''}</span>
                  <span class="text-blue-400/40">·</span>
                  <span class="text-xs font-bold text-[#004ce8] dark:text-blue-400 font-mono">${relativeTime}</span>
                </div>
                <button 
                  onclick="toggleBookmark('${item.id}', event)" 
                  class="touch-press p-2 -mr-2 text-xl text-slate-300 dark:text-slate-600 hover:text-amber-400 active:scale-125 transition z-10"
                  title="스크랩 저장"
                >
                  ${isBked ? '<span class="text-amber-400">★</span>' : '☆'}
                </button>
              </div>

              <!-- Big Bold Title -->
              <h2 class="font-black text-[16px] sm:text-[18px] leading-snug text-slate-900 dark:text-slate-100 group-hover:text-[#004ce8] dark:group-hover:text-blue-400 transition tracking-tight my-1.5">
                ${displayTitle}
              </h2>

              <!-- 16:9 Full-Width Media Image -->
              ${item.image ? `
                <div class="w-full aspect-video sm:aspect-[21/9] rounded-xl overflow-hidden bg-slate-100 dark:bg-slate-900 my-2.5 border border-blue-200/50 dark:border-blue-900/50 relative shadow-inner">
                  <img src="${item.image}" alt="${displayTitle}" referrerpolicy="no-referrer" onerror="this.closest('.aspect-video')?.remove()" class="w-full h-full object-cover group-hover:scale-[1.02] transition duration-300" loading="lazy" />
                </div>
              ` : ''}

              <!-- Snippet Text -->
              ${item.snippet ? `
                <p class="text-[13px] sm:text-sm text-slate-600 dark:text-slate-400 leading-relaxed line-clamp-2 my-1 font-medium">
                  ${item.snippet}
                </p>
              ` : ''}

              <!-- Card Footer: Category & Slash Link -->
              <div class="mt-3.5 pt-2.5 border-t border-blue-100 dark:border-blue-900/40 flex items-center justify-between text-xs text-slate-400 font-mono">
                <span class="text-slate-400 text-[11px]">CATEGORY: <strong class="text-slate-700 dark:text-slate-300 font-bold font-sans">${item.category_name || '일반'}</strong></span>
                <span class="font-black text-[#004ce8] dark:text-blue-400 flex items-center gap-1 group-hover:translate-x-1 transition font-sans text-xs">
                  슬래시 원문보기
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"/></svg>
                </span>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function setCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.cat-chip').forEach(btn => {
        if (btn.getAttribute('data-cat') === cat) {
          btn.className = "cat-chip touch-press px-3.5 py-2 rounded-xl transition bg-[#004ce8] text-white shrink-0 shadow-md shadow-blue-600/30 border border-blue-400/40";
        } else if (btn.id !== 'bookmark-filter-btn') {
          btn.className = "cat-chip touch-press px-3.5 py-2 rounded-xl transition bg-white/90 dark:bg-[#070e22]/90 text-slate-700 dark:text-slate-300 border border-blue-200 dark:border-blue-900/60 hover:border-blue-400 shrink-0 shadow-xs";
        }
      });
      renderCards();
    }

    function handleSearch(val) {
      searchQuery = val.trim();
      const clearBtn = document.getElementById('clear-search-btn');
      if (searchQuery) {
        clearBtn.classList.remove('hidden');
      } else {
        clearBtn.classList.add('hidden');
      }
      renderCards();
    }

    function clearSearch() {
      const input = document.getElementById('search-input');
      input.value = '';
      handleSearch('');
      input.focus();
    }

    // Go Home: Reset category, search, bookmark filter, switch to feed and scroll to top
    function goHome() {
      switchView('feed');
      setCategory('all');
      const input = document.getElementById('search-input');
      if (input) {
        input.value = '';
        handleSearch('');
      }
      if (showOnlyBookmarks) {
        toggleBookmarkFilter();
      }
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function toggleBookmarkFilter() {
      showOnlyBookmarks = !showOnlyBookmarks;
      const btn = document.getElementById('bookmark-filter-btn');
      if (showOnlyBookmarks) {
        btn.className = "cat-chip touch-press px-3.5 py-2 rounded-xl transition bg-amber-400 text-slate-950 font-black shrink-0 flex items-center gap-1 ml-auto shadow-md shadow-amber-400/30 border border-amber-300";
        btn.innerHTML = "<span>★ 스크랩됨</span>";
      } else {
        btn.className = "cat-chip touch-press px-3.5 py-2 rounded-xl transition bg-white/90 dark:bg-[#070e22]/90 text-slate-700 dark:text-slate-300 border border-blue-200 dark:border-blue-900/60 shrink-0 flex items-center gap-1 ml-auto shadow-xs";
        btn.innerHTML = "<span class='text-amber-400'>★</span><span>스크랩</span>";
      }
      renderCards();
    }

    // Scroll to Top
    window.addEventListener('scroll', () => {
      const topBtn = document.getElementById('scroll-top-btn');
      if (window.scrollY > 250) {
        topBtn.classList.remove('hidden');
      } else {
        topBtn.classList.add('hidden');
      }
    });

    function scrollToTop() {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // PWA Service Worker (Blue Card v6 with auto-update)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js?v=6').then((reg) => {
          reg.update();
        }).catch(console.error);

        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!refreshing) {
            refreshing = true;
            window.location.reload();
          }
        });
      });
    }

    // PWA Install Prompt
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById('pwa-banner').classList.remove('hidden');
    });

    function installPwa() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(() => {
          deferredPrompt = null;
          dismissPwaBanner();
        });
      }
    }

    function dismissPwaBanner() {
      document.getElementById('pwa-banner').classList.add('hidden');
    }

    // ==========================================
    // 📖 DIGI-DEX & LORE ENGINE (전 종 1,488마리 실시간 도감)
    // ==========================================
    let currentView = 'feed';
    let masterIndex = [];  // 1,488마리 전체 마스터 인덱스 (한글/일문원칭/영문/별칭)
    let localDigidex = []; // 사전 구축된 고품질 한국어 상세 도감
    let currentDexDigimon = null;
    let currentDexImgIndex = 0;
    let dexSearchTimer = null;

    // View Switching: [📡 실시간 피드] <-> [📖 디지몬 도감/설정집]
    function switchView(view) {
      currentView = view;
      const feedTab = document.getElementById('view-tab-feed');
      const dexTab = document.getElementById('view-tab-dex');
      const feedSec = document.getElementById('feed-view-section');
      const dexSec = document.getElementById('dex-view-section');

      if (view === 'feed') {
        feedTab.className = "py-2 rounded-xl text-xs sm:text-sm font-black transition flex items-center justify-center gap-2 bg-[#004ce8] text-white shadow-md shadow-blue-600/30";
        dexTab.className = "py-2 rounded-xl text-xs sm:text-sm font-black transition flex items-center justify-center gap-2 text-slate-600 dark:text-slate-400 hover:text-blue-600 dark:hover:text-blue-300";
        feedSec.classList.remove('hidden');
        dexSec.classList.add('hidden');
        hideSuggestions();
      } else {
        dexTab.className = "py-2 rounded-xl text-xs sm:text-sm font-black transition flex items-center justify-center gap-2 bg-[#004ce8] text-white shadow-md shadow-blue-600/30";
        feedTab.className = "py-2 rounded-xl text-xs sm:text-sm font-black transition flex items-center justify-center gap-2 text-slate-600 dark:text-slate-400 hover:text-blue-600 dark:hover:text-blue-300";
        dexSec.classList.remove('hidden');
        feedSec.classList.add('hidden');
        
        if (!currentDexDigimon) {
          selectQuickDex('오메가몬');
        }
      }
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Load Databases (1,488 All Index + Local High-Detail DB)
    async function loadDigidex() {
      try {
        const [resAll, resLocal] = await Promise.all([
          fetch(`data/digimon_all_index.json?t=${Date.now()}`),
          fetch(`data/digidex_ko.json?t=${Date.now()}`)
        ]);
        if (resAll.ok) {
          const dataAll = await resAll.json();
          masterIndex = dataAll.digimons || [];
        }
        if (resLocal.ok) {
          const dataLocal = await resLocal.json();
          localDigidex = dataLocal.digimons || [];
        }
        if (currentView === 'dex' && !currentDexDigimon) {
          selectQuickDex('오메가몬');
        }
      } catch (err) {
        console.error("Failed to load digidex databases", err);
      }
    }

    // Quick Tag Selection
    function selectQuickDex(name) {
      const input = document.getElementById('dex-search-input');
      if (input) input.value = name;
      hideSuggestions();
      executeDexSearch(name);
    }

    // Step-by-Step Smart Search Input Handler
    function handleDexSearch(query) {
      clearTimeout(dexSearchTimer);
      const clearBtn = document.getElementById('dex-clear-search-btn');
      const q = (query || '').trim().toLowerCase();
      
      if (q) {
        clearBtn.classList.remove('hidden');
      } else {
        clearBtn.classList.add('hidden');
        hideSuggestions();
        return;
      }

      dexSearchTimer = setTimeout(() => {
        renderSmartSuggestions(q);
      }, 150);
    }

    function clearDexSearch() {
      const input = document.getElementById('dex-search-input');
      if (input) {
        input.value = '';
        handleDexSearch('');
        hideSuggestions();
        input.focus();
      }
    }

    function hideSuggestions() {
      const box = document.getElementById('dex-suggestions-box');
      if (box) box.classList.add('hidden');
    }

    // Smart Gradual Suggestions (1글자: 핵심 칩, 2글자: 미니 카드, 3글자 이상: 정밀 풀 드롭다운)
    function renderSmartSuggestions(q) {
      const box = document.getElementById('dex-suggestions-box');
      if (!box || !masterIndex || masterIndex.length === 0) return;

      // 일치 디지몬 탐색 (한국어 더빙명, 일본 원칭, 영문명, 별칭 포괄 매칭)
      const matches = masterIndex.filter(d => {
        const koMatch = d.name_ko && d.name_ko.toLowerCase().includes(q);
        const jaMatch = d.name_ja_ko && d.name_ja_ko.toLowerCase().includes(q);
        const enMatch = d.name && d.name.toLowerCase().includes(q);
        const aliasMatch = (d.aliases || []).some(a => a.toLowerCase().includes(q));
        return koMatch || jaMatch || enMatch || aliasMatch;
      });

      if (matches.length === 0) {
        box.innerHTML = `
          <div class="p-3 text-center text-xs text-slate-500 font-medium">
            '${q}' 관련 디지몬을 찾을 수 없습니다. 영문명(예: Agumon)으로 검색해 보세요.
          </div>
        `;
        box.classList.remove('hidden');
        return;
      }

      const qLen = q.length;

      // 1. [1글자 입력 시] -> 컴팩트 태그 칩 (화면을 가리지 않고 가볍게 4~5개 노출)
      if (qLen === 1) {
        const topChips = matches.slice(0, 5);
        box.innerHTML = `
          <div class="p-1.5 space-y-1">
            <div class="flex items-center justify-between text-[10px] font-bold text-blue-600 dark:text-blue-400 font-mono px-1">
              <span>🎯 '${q}' 추천 디지몬</span>
              <span class="text-slate-400 font-normal">탭하여 선택</span>
            </div>
            <div class="flex items-center gap-1.5 flex-wrap pt-1">
              ${topChips.map(m => `
                <button 
                  onclick="selectDigimonById(${m.id}, '${m.name_ko}')" 
                  class="touch-press px-2.5 py-1.5 rounded-xl bg-blue-50 dark:bg-blue-950/60 hover:bg-blue-600 hover:text-white border border-blue-200 dark:border-blue-800 text-xs font-bold text-slate-800 dark:text-slate-200 transition flex items-center gap-1.5"
                >
                  ${m.image ? `<img src="${m.image}" class="w-4 h-4 object-contain" onerror="this.style.display='none'" />` : '👾'}
                  <span>${m.name_ko}</span>
                  ${m.name_ja_ko && m.name_ja_ko !== m.name_ko ? `<span class="text-[10px] text-blue-500/80 dark:text-blue-300">(${m.name_ja_ko})</span>` : ''}
                </button>
              `).join('')}
            </div>
          </div>
        `;
        box.classList.remove('hidden');
        return;
      }

      // 2. [2글자 입력 시] -> 미니 카드 형태 (최대 6개)
      if (qLen === 2) {
        const topCards = matches.slice(0, 6);
        box.innerHTML = `
          <div class="p-1 space-y-1">
            <div class="flex items-center justify-between text-[10px] font-bold text-blue-600 dark:text-blue-400 font-mono px-1">
              <span>🔍 '${q}' 관련 디지몬</span>
              <span class="text-slate-400 font-normal">상위 추천</span>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-1.5 pt-1">
              ${topCards.map(m => `
                <div 
                  onclick="selectDigimonById(${m.id}, '${m.name_ko}')" 
                  class="touch-press cursor-pointer p-2 rounded-xl bg-slate-50 dark:bg-slate-900/80 hover:bg-blue-50 dark:hover:bg-blue-950/60 border border-blue-200/60 dark:border-blue-900/60 flex items-center gap-2.5 transition"
                >
                  <div class="w-9 h-9 rounded-lg bg-white dark:bg-slate-800 border border-blue-200/40 p-0.5 shrink-0 flex items-center justify-center">
                    <img src="${m.image || ''}" alt="${m.name_ko}" class="max-w-full max-h-full object-contain" onerror="this.style.display='none'" />
                  </div>
                  <div class="min-w-0 flex-1">
                    <p class="font-extrabold text-xs text-slate-900 dark:text-slate-100 truncate">${m.name_ko}</p>
                    <p class="text-[10px] text-slate-500 font-mono truncate">${m.name_ja_ko ? `${m.name_ja_ko} · ` : ''}${m.name}</p>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
        box.classList.remove('hidden');
        return;
      }

      // 3. [3글자 이상 입력 시] -> 정밀 풀 드롭다운 (최대 12개)
      const topList = matches.slice(0, 12);
      box.innerHTML = `
        <div class="p-1 space-y-1">
          <div class="flex items-center justify-between px-1 text-[10px] font-mono font-bold text-blue-600 dark:text-blue-400">
            <span>⚡ 1,488 전 종 검색 결과 (${matches.length}마리 매칭)</span>
            <span class="text-slate-400 font-normal">터치하여 열람</span>
          </div>
          <div class="divide-y divide-blue-100 dark:divide-blue-900/40">
            ${topList.map(m => `
              <div 
                onclick="selectDigimonById(${m.id}, '${m.name_ko}')" 
                class="touch-press cursor-pointer p-2 hover:bg-blue-50 dark:hover:bg-blue-950/60 flex items-center justify-between gap-3 transition rounded-lg"
              >
                <div class="flex items-center gap-2.5 min-w-0">
                  <div class="w-8 h-8 rounded-lg bg-slate-100 dark:bg-slate-800 p-0.5 shrink-0 flex items-center justify-center">

    function selectDigimonById(id, name) {
      hideSuggestions();
      const input = document.getElementById('dex-search-input');
      if (input && name) input.value = name;
      fetchDigimonFullDetail(id, name);

    // Execute Search Trigger
    function executeDexSearch(q) {
      hideSuggestions();
      if (!q) {
        selectQuickDex('오메가몬');
        return;
      }

      // 인덱스에서 매칭되는 첫 번째 디지몬 선택 (한글, 일어원칭, 영문, 별칭 포괄)
      const matched = masterIndex.find(d => {
        const koMatch = d.name_ko && d.name_ko.toLowerCase() === q;
        const jaMatch = d.name_ja_ko && d.name_ja_ko.toLowerCase() === q;
        const enMatch = d.name && d.name.toLowerCase() === q;
        const aliasMatch = (d.aliases || []).some(a => a.toLowerCase() === q);
        return koMatch || jaMatch || enMatch || aliasMatch;
      }) || masterIndex.find(d => {
        return (d.name_ko && d.name_ko.toLowerCase().includes(q)) || 
               (d.name_ja_ko && d.name_ja_ko.toLowerCase().includes(q)) ||
               (d.name && d.name.toLowerCase().includes(q)) ||
               (d.aliases || []).some(a => a.toLowerCase().includes(q));
      });

      if (matched) {
        selectDigimonById(matched.id, matched.name_ko);
      } else {
        fetchDigimonFullDetail(q, q);
      }
    }

    function translateLevel(lvl) {
      if (!lvl) return '미확인';
      const l = String(lvl).toLowerCase().trim();
      if (l.includes('baby i') || l === 'fresh') return '유년기 I';
      if (l.includes('baby ii') || l.includes('in-training') || l === 'training') return '유년기 II';
      if (l.includes('child') || l.includes('rookie')) return '성장기';
      if (l.includes('adult') || l.includes('champion')) return '성숙기';
      if (l.includes('perfect') || (l.includes('ultimate') && !l.includes('mega'))) return '완전체';
      if (l.includes('mega') || l.includes('ultimate')) return '궁극체';
      if (l.includes('armor')) return '아머체';
      if (l.includes('hybrid')) return '하이브리드체';
      return lvl;
    }

    function translateAttribute(attr) {

      if (a.includes('variable')) return '가변 (Variable)';
      if (a.includes('unknown')) return '불명';

    }

    // 1,488 All Digimon Evolution Sanitation & Canonical Prioritization
    function cleanAndPrioritizeEvolutions(currentName, currentLevel, rawPrior, rawNext) {
      const nameLower = (currentName || '').toLowerCase().trim();

      // 1. Terminal Form Check (더 이상 진화가 없는 최종 형태 전수 판별)
      const isTerminal = 
        nameLower.includes('merciful mode') ||
        nameLower.includes('burst mode') ||
        nameLower.includes('paladin mode') ||
        nameLower.includes('crimson mode') ||
        nameLower.includes('future mode') ||
        nameLower.includes('satan mode') ||
        nameLower.includes('blast mode') ||
        nameLower.includes('superior mode');

      let cleanedNext = isTerminal ? [] : (rawNext ? [...rawNext] : []);

      // 2. Prior Evolution Filter: 조그레스 보조/제물 디지몬 배제 (e.g. 'with Omegamon...' 배제)
      let cleanedPrior = (rawPrior ? [...rawPrior] : []).filter(p => {
        const cond = (p.condition || '').toLowerCase().trim();
        if (!cond) return true;
        // 다른 디지몬의 조그레스 소재로 끌려간 보조 디지몬은 단독 진화전에서 제외
        if (cond.startsWith('with ') && !cond.startsWith('with or without')) {
          return false;
        }
        return true;
      });

      // 3. Level Consistency Check (성장기 진화 전에 성숙기/스카몬 등 역진화 데이터 배제)
      const curLvlKo = translateLevel(currentLevel);
      if (curLvlKo === '성장기') {
        cleanedPrior = cleanedPrior.filter(p => {
          const pName = (p.digimon || '').toLowerCase();
          return !pName.includes('greymon') && !pName.includes('sukamon') && !pName.includes('adult') && !pName.includes('champion');
        });
      }

      // 4. Lineage / Canonical affinity sort for ALL Digimon
      function getAffinityScore(candidateName, targetName) {
        const c = (candidateName || '').toLowerCase();
        const t = (targetName || '').toLowerCase();
        
        // 원작 대표 플래그십 진화쌍 가중치
        if (t.includes('merciful') && c === 'omegamon') return 3000;
        if (t === 'omegamon' && (c === 'wargreymon' || c === 'metalgarurumon')) return 3000;
        if (t === 'agumon' && (c === 'koromon' || c === 'greymon')) return 3000;
        if (t === 'greymon' && (c === 'agumon' || c === 'metalgreymon')) return 3000;
        if (t === 'metalgreymon' && (c === 'greymon' || c === 'wargreymon')) return 3000;
        if (t === 'gabumon' && (c === 'tsunomon' || c === 'garurumon')) return 3000;
        if (t === 'garurumon' && (c === 'gabumon' || c === 'weregarurumon')) return 3000;
        if (t === 'guilmon' && (c === 'gigimon' || c === 'growmon')) return 3000;
        if ((t === 'v-mon' || t === 'veemon') && (c === 'chibimon' || c.includes('xv-mon'))) return 3000;
        if (t.includes('tentomon') && c.includes('kabuterimon')) return 3000;
        if (t.includes('patamon') && (c.includes('angemon') || c.includes('tokomon'))) return 3000;
        if ((t.includes('tailmon') || t.includes('gatomon')) && (c.includes('angewomon') || c.includes('plotmon'))) return 3000;

        // 패밀리 이름 일치 가중치 (e.g. Greymon -> GeoGreymon, RizeGreymon 등)
        const baseClean = t.replace(/\(.*?\)/g, '').replace(/mode/g, '').replace(/x-antibody/g, '').trim();
        const baseWords = baseClean.split(' ').filter(w => w.length >= 4);
        for (const w of baseWords) {
          if (c.includes(w)) return 1000;
        }
        return 0;
      }

      cleanedPrior.sort((a, b) => getAffinityScore(b.digimon, currentName) - getAffinityScore(a.digimon, currentName));
      cleanedNext.sort((a, b) => getAffinityScore(b.digimon, currentName) - getAffinityScore(a.digimon, currentName));

      // 5. Korean Name Lookup for each evolution
      function enrichWithKorean(evList) {
        return evList.map(ev => {
          const m = masterIndex.find(idx => idx.id === ev.id || idx.name.toLowerCase() === (ev.digimon || '').toLowerCase());
          return {
            id: ev.id,
            digimon: ev.digimon,
            name_ko: m ? m.name_ko : (ev.digimon.endsWith('mon') ? ev.digimon.slice(0, -3) + '몬' : ev.digimon),
            name_ja_ko: m ? m.name_ja_ko : '',
            image: ev.image || (m ? m.image : 'https://digi-api.com/images/digimon/w/Agumon.png')
          };
        });
      }

      return {
        isTerminal,
        prior: enrichWithKorean(cleanedPrior),
        next: enrichWithKorean(cleanedNext)
      };
    }

    // Client-side Profile & Skill Translator
    const translationCache = {};
    async function translateTextToKo(text) {
      if (!text || text.length < 2) return text;
      if (translationCache[text]) return translationCache[text];

      try {
        const cleanText = text.replace(/[\r\n]+/g, ' ').slice(0, 500);
        const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(cleanText)}&langpair=en|ko`;
        const res = await fetch(url);
        if (res.ok) {
          const data = await res.json();
          if (data && data.responseData && data.responseData.translatedText) {
            const translated = data.responseData.translatedText;
            translationCache[text] = translated;
            return translated;
          }
        }
      } catch (_) {}
      return text;
    }

    // Fetch Full Detail: 1차 Local DB -> 2차 Real-time Network API (Digi-API 1,488마리)
    async function fetchDigimonFullDetail(idOrQuery, displayName) {
      const container = document.getElementById('dex-detail-container');
      
      // 1. Local High-Detail DB 확인 (고유 식별자가 로컬 12종 ID와 일치할 때만 한정)
      const isLocalId = localDigidex.some(d => String(d.id).toLowerCase() === String(idOrQuery).toLowerCase());
      
      if (isLocalId) {
        const localMatch = localDigidex.find(d => String(d.id).toLowerCase() === String(idOrQuery).toLowerCase());
        if (localMatch) {
          renderDexDetail(localMatch);
          // 진화 체계가 비어있다면 백그라운드에서 Digi-API로 정통 진화 트리 보강
          if ((!localMatch.nextEvolutions || localMatch.nextEvolutions.length === 0) && localMatch.name_en) {
            fetch(`https://digi-api.com/api/v1/digimon/${encodeURIComponent(localMatch.name_en)}`)
              .then(res => res.json())
              .then(apiData => {
                if (currentDexDigimon && currentDexDigimon.id === localMatch.id) {
                  const evoData = cleanAndPrioritizeEvolutions(localMatch.name_en, localMatch.level, apiData.priorEvolutions, apiData.nextEvolutions);
                  currentDexDigimon.priorEvolutions = evoData.prior;
                  currentDexDigimon.nextEvolutions = evoData.next;
                  currentDexDigimon.isTerminal = evoData.isTerminal;
                  updateDexCard();
                }
              }).catch(() => {});
          }
          return;
        }
      }

      // 2. Real-time Network Fetch (Digi-API 1,488 All Digimon)
      container.innerHTML = `
        <div class="p-8 text-center bg-white/80 dark:bg-[#070e22]/80 rounded-2xl border border-blue-200 dark:border-blue-900/60 shadow-sm animate-pulse">
          <div class="text-3xl mb-2 animate-bounce">📡</div>
          <p class="font-extrabold text-sm text-[#004ce8] dark:text-blue-400">디지털 월드 실시간 통신 접속 중...</p>
          <p class="text-xs text-slate-500 mt-1">'${displayName || idOrQuery}' 공식 도감 및 카드 데이터를 불러옵니다.</p>
        </div>
      `;

      try {
        const [apiRes, cardRes] = await Promise.all([
          fetch(`https://digi-api.com/api/v1/digimon/${encodeURIComponent(idOrQuery)}`),
          fetch(`https://digimoncard.io/api-public/search.php?n=${encodeURIComponent(displayName || idOrQuery)}`).catch(() => null)
        ]);

        if (!apiRes.ok) throw new Error("NotFound");
        const apiData = await apiRes.json();

        // TCG 카드 이미지
        let tcgImages = [];
        if (cardRes && cardRes.ok) {
          try {
            const cardData = await cardRes.json();
            if (Array.isArray(cardData)) {
              tcgImages = cardData.filter(c => c.id).slice(0, 3).map(c => ({
                type: 'tcg',
                label: `🃏 TCG 카드 (${c.id})`,
                url: `https://images.digimoncard.io/images/cards/${c.id}.jpg`
              }));
            }
          } catch (_) {}
        }

        // 이미지 구성
        const images = [];
        if (apiData.images && apiData.images.length > 0) {
          images.push({ type: 'official', label: '🎨 공식 도감', url: apiData.images[0].href });
        }
        images.push(...tcgImages);

        // 설명문
        const descriptions = apiData.descriptions || [];
        const engDesc = descriptions.find(d => d.language === 'en_us') || descriptions[0];

        // 인덱스에서 한글명/일문명 보강
        const idxEntry = masterIndex.find(m => m.id === apiData.id) || {};

        // 스펙 완전 한글화
        const rawLevel = (apiData.levels && apiData.levels[0]) ? apiData.levels[0].level : '미확인';
        const rawAttr = (apiData.attributes && apiData.attributes[0]) ? apiData.attributes[0].attribute : '미확인';
        const rawType = (apiData.types && apiData.types[0]) ? apiData.types[0].type : '미확인';

        const koLevel = translateLevel(rawLevel);
        const koAttr = translateAttribute(rawAttr);
        const koType = translateType(rawType);

        // 1,488 전 종 정통 진화 체계 정제 및 최종 형태 판별
        const evoData = cleanAndPrioritizeEvolutions(apiData.name, rawLevel, apiData.priorEvolutions, apiData.nextEvolutions);

        const fullDigimon = {
          id: apiData.id,
          name_ko: idxEntry.name_ko || apiData.name,
          name_ja_ko: idxEntry.name_ja_ko || '',
          name_en: apiData.name,
          level: koLevel,
          attribute: koAttr,
          type: koType,
          images: images,
          skills: (apiData.skills || []).slice(0, 4).map(s => ({
            name: s.skill,
            desc: s.description || '공식 필살기입니다.'
          })),
          profile: engDesc ? engDesc.description : '공식 도감 데이터가 기록되어 있습니다.',
          priorEvolutions: evoData.prior,
          nextEvolutions: evoData.next,
          isTerminal: evoData.isTerminal
        };

        renderDexDetail(fullDigimon);

        // 백그라운드 공식 도감 설명 한글 번역
        if (fullDigimon.profile && /[a-zA-Z]/.test(fullDigimon.profile)) {
          translateTextToKo(fullDigimon.profile).then(translated => {
            if (currentDexDigimon && currentDexDigimon.id === fullDigimon.id && translated !== fullDigimon.profile) {
              currentDexDigimon.profile = translated;
              const profileEl = document.getElementById('dex-profile-text');
              const statusEl = document.getElementById('dex-translation-status');
              if (profileEl) profileEl.textContent = translated;
              if (statusEl) statusEl.innerHTML = `<span class="px-1.5 py-0.5 rounded bg-blue-100 dark:bg-blue-900/60 text-blue-700 dark:text-blue-300 font-bold">🇰🇷 한국어 번역 완료</span>`;
            }
          });
        }
      } catch (err) {
        container.innerHTML = `
          <div class="py-12 text-center bg-white/80 dark:bg-[#070e22]/80 rounded-2xl border border-blue-200 dark:border-blue-900/60 p-6 shadow-sm">
            <div class="text-4xl mb-2">🔍</div>
            <p class="font-extrabold text-sm text-slate-800 dark:text-slate-200">'${displayName || idOrQuery}' 디지몬을 찾을 수 없습니다.</p>
            <p class="text-xs mt-1 text-slate-500">정확한 한국어 더빙명, 일본 원칭 또는 영어 디지몬 이름으로 검색해 보세요.</p>
          </div>
        `;
      }
    }

    // Render Digimon Detailed Profile
    function renderDexDetail(digimon) {
      currentDexDigimon = digimon;
      currentDexImgIndex = 0;
      updateDexCard();
    }

    // Cycle Through Images (Official -> Dot -> TCG)
    function cycleDexImage() {
      if (!currentDexDigimon || !currentDexDigimon.images || currentDexDigimon.images.length <= 1) return;
      currentDexImgIndex = (currentDexImgIndex + 1) % currentDexDigimon.images.length;
      updateDexCardImageOnly();
    }

    function setDexImage(index) {
      if (!currentDexDigimon || !currentDexDigimon.images) return;
      currentDexImgIndex = index;
      updateDexCardImageOnly();
    }

    function updateDexCardImageOnly() {
      const img = currentDexDigimon.images[currentDexImgIndex];
      const imgElem = document.getElementById('dex-main-img');
      const badgeElem = document.getElementById('dex-img-mode-badge');
      const frameElem = document.getElementById('dex-img-frame');
      const selectorElem = document.getElementById('dex-img-selector');

      if (!imgElem || !img) return;

      imgElem.src = img.url;
      badgeElem.textContent = img.label;

      if (img.type === 'dot') {
        frameElem.className = "lcd-screen w-full aspect-square max-h-72 sm:max-h-80 rounded-2xl flex items-center justify-center p-6 relative overflow-hidden transition-all duration-300";
        imgElem.className = "w-32 h-32 sm:w-40 sm:h-40 object-contain drop-shadow-md select-none";
        imgElem.style.imageRendering = "pixelated";
      } else {
        frameElem.className = "bg-gradient-to-b from-blue-50 to-slate-100 dark:from-[#08122c] dark:to-[#050b1a] w-full aspect-square max-h-72 sm:max-h-80 rounded-2xl flex items-center justify-center p-4 relative overflow-hidden transition-all duration-300 border border-blue-200/60 dark:border-blue-900/60 shadow-inner";
        imgElem.className = "max-w-full max-h-full object-contain filter drop-shadow-xl hover:scale-105 transition duration-300 select-none";
        imgElem.style.imageRendering = "auto";
      }

      // Update selector buttons
      if (selectorElem) {
        selectorElem.innerHTML = currentDexDigimon.images.map((item, idx) => `
          <button 
            onclick="setDexImage(${idx})" 
            class="touch-press px-2.5 py-1 rounded-lg text-[11px] font-extrabold transition ${idx === currentDexImgIndex ? 'bg-[#004ce8] text-white shadow-xs' : 'bg-white/80 dark:bg-slate-900 text-slate-600 dark:text-slate-400 border border-blue-200 dark:border-blue-900/60'}"
          >
            ${item.label}
          </button>
        `).join('');
      }
    }

    // Dex Image Fallback Handler (엑스박스 방지: 실패 시 1순위 공식 일러로 자동 복구)
    function handleDexImgError(imgElem) {
      if (!currentDexDigimon || !currentDexDigimon.images || currentDexDigimon.images.length === 0) return;
      const fallbackUrl = currentDexDigimon.images[0].url;
      if (fallbackUrl && imgElem.src !== fallbackUrl) {
        imgElem.src = fallbackUrl;
        imgElem.style.imageRendering = "auto";
        const badgeElem = document.getElementById('dex-img-mode-badge');
        if (badgeElem) badgeElem.textContent = "🎨 공식 도감 (대체)";
        const frameElem = document.getElementById('dex-img-frame');
        if (frameElem) {
          frameElem.className = "bg-gradient-to-b from-blue-50 to-slate-100 dark:from-[#08122c] dark:to-[#050b1a] w-full aspect-square max-h-72 sm:max-h-80 rounded-2xl flex items-center justify-center p-4 relative overflow-hidden transition-all duration-300 border border-blue-200/60 dark:border-blue-900/60 shadow-inner";
        }
      }
    }

    function updateDexCard() {
      const container = document.getElementById('dex-detail-container');
      const d = currentDexDigimon;
      if (!d) return;

      const currentImg = (d.images && d.images[currentDexImgIndex]) || { url: '', label: '이미지 없음', type: 'official' };
      const isDot = currentImg.type === 'dot';

      container.innerHTML = `
        <article class="blue-card-item bg-white/95 dark:bg-[#070e22]/95 border-2 border-blue-400 dark:border-blue-600 rounded-3xl p-4 sm:p-6 shadow-xl relative overflow-hidden">
          <!-- Blue Card Left Stripe -->
          <div class="absolute left-0 top-0 bottom-0 w-2.5 sm:w-3 bg-slate-900 border-r border-slate-950"></div>
          
          <!-- Watermark -->
          <div class="absolute top-2 right-2 w-28 h-28 dot-matrix-watermark rounded-tr-2xl pointer-events-none"></div>

          <div class="pl-2 sm:pl-3 space-y-4">
            
            <!-- Header: Title & Badges (한국 더빙명 + 일본 원칭 병기) -->
            <div class="flex items-start justify-between gap-3 flex-wrap border-b border-blue-200/60 dark:border-blue-900/60 pb-3">
              <div>
                <div class="flex items-center gap-2">
                  <span class="text-[10px] font-black px-2 py-0.5 rounded bg-blue-600 text-white font-mono tracking-wider shadow-xs">DIGI-DEX ARCHIVE</span>
                  <span class="text-xs font-bold text-slate-400 font-mono">${d.name_en}</span>
                </div>
                <h2 class="text-2xl sm:text-3xl font-black text-slate-900 dark:text-white tracking-tight mt-1 flex items-baseline gap-2 flex-wrap">
                  <span>${d.name_ko}</span>
                  ${d.name_ja_ko && d.name_ja_ko !== d.name_ko ? `<span class="text-sm sm:text-base font-bold text-blue-600 dark:text-blue-400">(${d.name_ja_ko} / ${d.name_en})</span>` : `<span class="text-xs font-bold text-slate-400 font-mono">(${d.name_en})</span>`}
                </h2>
              </div>

              <!-- Spec Badges -->
              <div class="flex items-center gap-1.5 flex-wrap">
                <span class="text-xs font-black px-2.5 py-1 rounded-xl bg-blue-500/15 text-blue-600 dark:text-blue-400 border border-blue-500/30">${d.level}</span>
                <span class="text-xs font-black px-2.5 py-1 rounded-xl bg-purple-500/15 text-purple-600 dark:text-purple-400 border border-purple-500/30">${d.attribute}</span>
                <span class="text-xs font-black px-2.5 py-1 rounded-xl bg-emerald-500/15 text-emerald-600 dark:text-emerald-400 border border-emerald-500/30">${d.type}</span>
              </div>
            </div>

            <!-- Interactive Illustration / Dot Frame (Click to Switch!) -->
            <div class="space-y-2">
              <div class="flex items-center justify-between text-xs font-bold px-1 text-slate-500 dark:text-slate-400">
                <span class="flex items-center gap-1.5 text-blue-600 dark:text-blue-400 font-bold">
                  <span class="animate-bounce">👆</span>
                  <span>화면 클릭 시 비주얼 순환 전환</span>
                </span>
                <span id="dex-img-mode-badge" class="font-mono text-[11px] font-black text-slate-700 dark:text-slate-200 bg-blue-50 dark:bg-blue-950 px-2 py-0.5 rounded border border-blue-200 dark:border-blue-800">${currentImg.label}</span>
              </div>

              <div 
                id="dex-img-frame" 
                onclick="cycleDexImage()" 
                class="${isDot ? 'lcd-screen' : 'bg-gradient-to-b from-blue-50 to-slate-100 dark:from-[#08122c] dark:to-[#050b1a] border border-blue-200/60 dark:border-blue-900/60 shadow-inner'} w-full aspect-square max-h-72 sm:max-h-80 rounded-2xl flex items-center justify-center p-4 relative overflow-hidden cursor-pointer select-none group touch-press transition-all duration-300"
                title="클릭하여 도트/공식일러/카드 전환"
              >
                <img 
                  id="dex-main-img" 
                  src="${currentImg.url}" 
                  alt="${d.name_ko}" 
                  onerror="handleDexImgError(this)"
                  style="${isDot ? 'image-rendering: pixelated;' : ''}"
                  class="${isDot ? 'w-32 h-32 sm:w-40 sm:h-40 object-contain drop-shadow-md' : 'max-w-full max-h-full object-contain filter drop-shadow-xl group-hover:scale-105 transition duration-300'}" 
                />
                <div class="absolute bottom-2.5 right-2.5 px-2 py-1 rounded-lg bg-black/60 backdrop-blur text-[10px] text-white font-bold flex items-center gap-1 pointer-events-none opacity-80 group-hover:opacity-100 transition">
                  <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                  <span>터치 시 전환</span>
                </div>
              </div>

              <!-- Quick Image Buttons -->
              <div id="dex-img-selector" class="flex items-center gap-1.5 justify-center flex-wrap pt-1">
                ${(d.images || []).map((item, idx) => `
                  <button 
                    onclick="setDexImage(${idx})" 
                    class="touch-press px-2.5 py-1 rounded-lg text-[11px] font-extrabold transition ${idx === currentDexImgIndex ? 'bg-[#004ce8] text-white shadow-xs' : 'bg-white/80 dark:bg-slate-900 text-slate-600 dark:text-slate-400 border border-blue-200 dark:border-blue-900/60'}"
                  >
                    ${item.label}
                  </button>
                `).join('')}
              </div>
            </div>

            <!-- Special Moves / Skills -->
            ${d.skills && d.skills.length > 0 ? `
              <div class="space-y-2 pt-2 border-t border-blue-200/60 dark:border-blue-900/60">
                <h3 class="text-xs font-black tracking-wider text-blue-600 dark:text-blue-400 uppercase font-mono flex items-center gap-1.5">
                  <span>⚡</span>
                  <span>SPECIAL MOVES (대표 필살기)</span>
                </h3>
                <div class="grid grid-cols-1 gap-2">
                  ${d.skills.map(s => `
                    <div class="p-2.5 rounded-xl bg-blue-50/60 dark:bg-blue-950/40 border border-blue-200/50 dark:border-blue-900/50 text-xs">
                      <p class="font-black text-slate-900 dark:text-slate-100 text-[13px] text-blue-600 dark:text-blue-400">${s.name}</p>
                      <p class="text-slate-600 dark:text-slate-400 text-[12px] mt-0.5 leading-relaxed font-medium">${s.desc}</p>
                    </div>
                  `).join('')}
                </div>
              </div>
            ` : ''}

            <!-- Official Lore / Archive Profile -->
            <div class="space-y-2 pt-2 border-t border-blue-200/60 dark:border-blue-900/60">
              <div class="flex items-center justify-between">
                <h3 class="text-xs font-black tracking-wider text-blue-600 dark:text-blue-400 uppercase font-mono flex items-center gap-1.5">
                  <span>📖</span>
                  <span>OFFICIAL LORE (반다이 공식 도감 설정집)</span>
                </h3>
                <span id="dex-translation-status" class="text-[10px] text-blue-400 font-mono"></span>
              </div>
              <div class="p-4 rounded-2xl bg-slate-900/95 text-slate-200 border border-blue-500/40 shadow-inner font-sans text-xs sm:text-[13px] leading-relaxed relative overflow-hidden">
                <div class="absolute -right-6 -bottom-6 w-24 h-24 bg-blue-600/10 rounded-full blur-xl pointer-events-none"></div>
                <p id="dex-profile-text" class="relative z-10 whitespace-pre-line text-slate-300 font-medium">${d.profile}</p>
              </div>
            </div>

            <!-- Evolution Chain (진화 체계 및 연관 디지몬) -->
            ${d.isTerminal || (d.priorEvolutions && d.priorEvolutions.length > 0) || (d.nextEvolutions && d.nextEvolutions.length > 0) ? `
              <div class="space-y-3 pt-3 border-t border-blue-200/60 dark:border-blue-900/60">
                <h3 class="text-xs font-black tracking-wider text-blue-600 dark:text-blue-400 uppercase font-mono flex items-center justify-between">
                  <span class="flex items-center gap-1.5">
                    <span>🔗</span>
                    <span>EVOLUTION CHAIN (진화 체계 & 연관 디지몬)</span>
                  </span>
                  <span class="text-[10px] text-slate-400 font-normal">탭하여 도감 이동</span>
                </h3>

                <!-- Next Evolutions (진화 후) -->
                ${d.isTerminal ? `
                  <div class="p-3 rounded-2xl bg-blue-50 dark:bg-blue-950/50 border border-blue-200 dark:border-blue-800/80 text-xs flex items-center gap-2.5">
                    <span class="text-lg">⚡</span>
                    <div>
                      <p class="font-extrabold text-blue-800 dark:text-blue-300">최종 진화 형태 (Terminal Form)</p>
                      <p class="text-[11px] text-slate-500 dark:text-slate-400 mt-0.5">공식 도감상 더 이상의 진화 단계가 없는 궁극의 형태입니다.</p>
                    </div>
                  </div>
                ` : (d.nextEvolutions && d.nextEvolutions.length > 0 ? `
                  <div class="space-y-1.5">
                    <p class="text-[11px] font-bold text-slate-500 dark:text-slate-400">진화 가능 디지몬 (${d.nextEvolutions.length}체):</p>
                    <div class="flex items-center gap-2 overflow-x-auto pb-1.5 no-scrollbar">
                      ${d.nextEvolutions.slice(0, 15).map(ev => `
                        <div 
                          onclick="selectDigimonById(${ev.id}, '${ev.name_ko || ev.digimon}')" 
                          class="touch-press cursor-pointer shrink-0 p-2 rounded-xl bg-slate-50 dark:bg-slate-900/80 hover:bg-blue-50 dark:hover:bg-blue-950 border border-blue-200/60 dark:border-blue-900/60 flex items-center gap-2 transition"
                        >
                          <img src="${ev.image || 'https://digi-api.com/images/digimon/w/Agumon.png'}" class="w-8 h-8 object-contain rounded" onerror="this.src='https://digi-api.com/images/digimon/w/Agumon.png'" />
                          <div>
                            <span class="text-xs font-bold text-slate-800 dark:text-slate-200 whitespace-nowrap block">${ev.name_ko || ev.digimon}</span>
                            ${ev.name_ja_ko && ev.name_ja_ko !== ev.name_ko ? `<span class="text-[9px] text-blue-500 font-mono block">(${ev.name_ja_ko})</span>` : `<span class="text-[9px] text-slate-400 font-mono block">${ev.digimon}</span>`}
                          </div>
                        </div>
                      `).join('')}
                    </div>
                  </div>
                ` : '')}

                <!-- Prior Evolutions (진화 전) -->
                ${d.priorEvolutions && d.priorEvolutions.length > 0 ? `
                  <div class="space-y-1.5 pt-1">
                    <p class="text-[11px] font-bold text-slate-500 dark:text-slate-400">진화 전 형태 (${d.priorEvolutions.length}체):</p>
                    <div class="flex items-center gap-2 overflow-x-auto pb-1.5 no-scrollbar">
                      ${d.priorEvolutions.slice(0, 10).map(ev => `
                        <div 
                          onclick="selectDigimonById(${ev.id}, '${ev.name_ko || ev.digimon}')" 
                          class="touch-press cursor-pointer shrink-0 p-2 rounded-xl bg-slate-50 dark:bg-slate-900/80 hover:bg-blue-50 dark:hover:bg-blue-950 border border-blue-200/60 dark:border-blue-900/60 flex items-center gap-2 transition"
                        >
                          <img src="${ev.image || 'https://digi-api.com/images/digimon/w/Agumon.png'}" class="w-8 h-8 object-contain rounded" onerror="this.src='https://digi-api.com/images/digimon/w/Agumon.png'" />
                          <div>
                            <span class="text-xs font-bold text-slate-800 dark:text-slate-200 whitespace-nowrap block">${ev.name_ko || ev.digimon}</span>
                            ${ev.name_ja_ko && ev.name_ja_ko !== ev.name_ko ? `<span class="text-[9px] text-blue-500 font-mono block">(${ev.name_ja_ko})</span>` : `<span class="text-[9px] text-slate-400 font-mono block">${ev.digimon}</span>`}
                          </div>
                        </div>
                      `).join('')}
                    </div>
                  </div>
                ` : ''}
              </div>
            ` : ''}

          </div>
        </article>
      `;
    }

    // Initialize App
    initTheme();
    updatePeriodButtons();
    fetchFeeds();
    loadDigidex();
  </script>
</body>
</html>
