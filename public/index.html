<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DIGI-FEED | 디지몬 실시간 자동 모니터</title>
  
  <!-- PWA Meta -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#f97316">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="디지피드">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#fff7ed',
              100: '#ffedd5',
              500: '#f97316',
              600: '#ea580c',
              700: '#c2410c',
            }
          }
        }
      }
    }
  </script>
  <style>
    /* Mobile app scrollbar */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.4); border-radius: 9999px; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    body { -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans transition-colors duration-200">

  <!-- Header -->
  <header class="sticky top-0 z-30 bg-slate-900/90 backdrop-blur-md border-b border-slate-800">
    <div class="max-w-6xl mx-auto px-4 h-14 flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <span class="text-2xl">👾</span>
        <div>
          <span class="font-extrabold text-base tracking-wider text-orange-500">DIGI-FEED</span>
          <span class="text-[11px] text-slate-400 ml-1.5 hidden sm:inline">디지몬 자동 서칭</span>
        </div>
      </div>

      <!-- Controls -->
      <div class="flex items-center gap-2">
        <button id="theme-toggle" onclick="toggleTheme()" class="p-2 rounded-lg text-slate-400 hover:text-slate-100 hover:bg-slate-800 transition" title="테마 변경">
          <span id="theme-icon">🌙</span>
        </button>
        <button onclick="fetchFeeds(true)" class="flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold rounded-lg bg-orange-600 hover:bg-orange-500 text-white shadow-sm transition active:scale-95">
          <svg id="refresh-spinner" class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
          <span class="hidden sm:inline">새로고침</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="flex-1 max-w-6xl w-full mx-auto px-4 py-4 space-y-4">

    <!-- Search & Filter Bar -->
    <div class="space-y-3">
      <!-- Search Input -->
      <div class="relative">
        <svg class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        <input 
          type="text" 
          id="search-input" 
          oninput="handleSearch(this.value)"
          placeholder="디지몬, 굿즈, 카드명 검색 (예: 오메가몬, 디지카, 피규어)..." 
          class="w-full pl-10 pr-4 py-2.5 text-sm rounded-xl bg-slate-800/80 border border-slate-700/80 focus:outline-none focus:border-orange-500 text-slate-100 placeholder:text-slate-400 transition shadow-inner"
        />
      </div>

      <!-- Category Filter Chips -->
      <div class="flex items-center gap-1.5 overflow-x-auto pb-1 no-scrollbar text-xs">
        <button onclick="setCategory('all')" class="cat-chip px-3 py-1.5 rounded-full font-medium transition bg-orange-500 text-white" data-cat="all">전체</button>
        <button onclick="setCategory('figure')" class="cat-chip px-3 py-1.5 rounded-full font-medium transition bg-slate-800 text-slate-300 border border-slate-700 hover:text-white" data-cat="figure">🧸 피규어/굿즈</button>
        <button onclick="setCategory('card')" class="cat-chip px-3 py-1.5 rounded-full font-medium transition bg-slate-800 text-slate-300 border border-slate-700 hover:text-white" data-cat="card">🃏 카드게임(TCG)</button>
        <button onclick="setCategory('game')" class="cat-chip px-3 py-1.5 rounded-full font-medium transition bg-slate-800 text-slate-300 border border-slate-700 hover:text-white" data-cat="game">🎮 게임/애니</button>
        <button onclick="setCategory('community')" class="cat-chip px-3 py-1.5 rounded-full font-medium transition bg-slate-800 text-slate-300 border border-slate-700 hover:text-white" data-cat="community">🔥 커뮤니티 인기</button>
        <button onclick="toggleBookmarkFilter()" id="bookmark-filter-btn" class="ml-auto px-3 py-1.5 rounded-full font-medium transition bg-slate-800 text-slate-300 border border-slate-700 hover:text-white flex items-center gap-1">
          <span>⭐ 스크랩</span>
        </button>
      </div>
    </div>

    <!-- Status Bar -->
    <div class="flex items-center justify-between text-[11px] text-slate-400 px-1">
      <div class="flex items-center gap-1.5">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        <span id="last-updated-text">데이터 로딩 중...</span>
      </div>
      <div id="item-count-text">0건 탐색됨</div>
    </div>

    <!-- Feeds Grid -->
    <div id="cards-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3.5">
      <!-- Loading Skeletons -->
      <div class="p-4 rounded-xl bg-slate-800/50 border border-slate-800 animate-pulse h-36"></div>
      <div class="p-4 rounded-xl bg-slate-800/50 border border-slate-800 animate-pulse h-36"></div>
      <div class="p-4 rounded-xl bg-slate-800/50 border border-slate-800 animate-pulse h-36"></div>
    </div>

  </main>

  <!-- PWA Install Banner (Conditional) -->
  <div id="pwa-banner" class="hidden fixed bottom-4 left-4 right-4 max-w-md mx-auto p-4 rounded-2xl bg-orange-600 text-white shadow-2xl flex items-center justify-between z-50">
    <div class="text-xs">
      <p class="font-bold">앱으로 더 편리하게 보기</p>
      <p class="text-orange-100 mt-0.5">홈 화면에 추가하면 앱처럼 열립니다.</p>
    </div>
    <div class="flex items-center gap-2">
      <button onclick="installPwa()" class="px-3 py-1.5 bg-white text-orange-600 font-bold text-xs rounded-lg shadow">추가</button>
      <button onclick="dismissPwaBanner()" class="p-1 text-orange-200 hover:text-white">✕</button>
    </div>
  </div>

  <script>
    // State
    let feeds = [];
    let currentCategory = 'all';
    let searchQuery = '';
    let showOnlyBookmarks = false;
    let deferredPrompt = null;

    // Load Bookmarks from LocalStorage
    function getBookmarks() {
      try {
        return JSON.parse(localStorage.getItem('digi_bookmarks') || '[]');
      } catch (e) {
        return [];
      }
    }

    function saveBookmarks(bks) {
      localStorage.setItem('digi_bookmarks', JSON.stringify(bks));
    }

    function toggleBookmark(id) {
      let bks = getBookmarks();
      if (bks.includes(id)) {
        bks = bks.filter(x => x !== id);
      } else {
        bks.push(id);
      }
      saveBookmarks(bks);
      renderCards();
    }

    // Fetch Feeds JSON
    async function fetchFeeds(isManual = false) {
      const spinner = document.getElementById('refresh-spinner');
      if (spinner) spinner.classList.add('animate-spin');

      try {
        const res = await fetch(`digimon_feeds.json?t=${Date.now()}`);
        if (!res.ok) throw new Error("Feeds file not found");
        const data = await res.json();
        feeds = data.feeds || [];
        document.getElementById('last-updated-text').textContent = `최근 갱신: ${data.last_updated || '방금 전'}`;
        document.getElementById('item-count-text').textContent = `총 ${feeds.length}건`;
        renderCards();
      } catch (err) {
        console.error(err);
        document.getElementById('last-updated-text').textContent = "피드 로드 실패 (새로고침을 눌러보세요)";
      } finally {
        if (spinner) spinner.classList.remove('animate-spin');
      }
    }

    // Render Cards
    function renderCards() {
      const container = document.getElementById('cards-container');
      const bks = getBookmarks();

      const filtered = feeds.filter(item => {
        const matchesCat = currentCategory === 'all' || item.category === currentCategory;
        const matchesSearch = item.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                              (item.snippet && item.snippet.toLowerCase().includes(searchQuery.toLowerCase()));
        const isBked = bks.includes(item.id);
        const matchesBk = !showOnlyBookmarks || isBked;
        return matchesCat && matchesSearch && matchesBk;
      });

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="col-span-full py-16 text-center text-slate-500">
            <div class="text-4xl mb-2">🔍</div>
            <p class="font-medium text-sm">해당하는 디지몬 소식이 없습니다.</p>
            <p class="text-xs mt-1 text-slate-600">검색어 또는 다른 카테고리를 눌러보세요.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(item => {
        const isBked = bks.includes(item.id);
        const badgeColor = item.source_badge === '루리웹' 
          ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30'
          : item.source_badge === '디시'
          ? 'bg-purple-500/10 text-purple-400 border-purple-500/30'
          : item.source_badge === '공식/글로벌'
          ? 'bg-blue-500/10 text-blue-400 border-blue-500/30'
          : 'bg-amber-500/10 text-amber-400 border-amber-500/30';

        return `
          <div class="bg-slate-800/70 border border-slate-700/70 hover:border-orange-500/50 rounded-xl overflow-hidden shadow-sm hover:shadow-md transition flex flex-col justify-between group">
            ${item.image ? `
              <div class="h-32 w-full overflow-hidden bg-black/20 relative">
                <img src="${item.image}" alt="${item.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" loading="lazy" />
              </div>
            ` : ''}

            <div class="p-3.5 flex-1 flex flex-col justify-between space-y-2.5">
              <div>
                <div class="flex items-center justify-between gap-1.5 mb-1.5">
                  <span class="text-[10px] font-semibold px-2 py-0.5 rounded border ${badgeColor}">${item.source_badge || item.source}</span>
                  <span class="text-[10px] text-slate-400">${item.created_at || ''}</span>
                </div>
                <h3 class="font-bold text-sm leading-snug line-clamp-2 text-slate-100 group-hover:text-orange-400 transition">
                  ${item.title}
                </h3>
                <p class="text-xs text-slate-400 line-clamp-2 mt-1 leading-relaxed">
                  ${item.snippet || ''}
                </p>
              </div>

              <div class="pt-2 border-t border-slate-700/60 flex items-center justify-between text-xs">
                <button onclick="toggleBookmark('${item.id}')" class="flex items-center gap-1 ${isBked ? 'text-amber-400' : 'text-slate-400 hover:text-amber-300'} transition">
                  <span>${isBked ? '★' : '☆'}</span>
                  <span>${isBked ? '보관됨' : '스크랩'}</span>
                </button>
                <a href="${item.link}" target="_blank" rel="noopener noreferrer" class="font-medium text-orange-400 hover:underline flex items-center gap-1">
                  원문 보기
                  <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
                </a>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function setCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.cat-chip').forEach(btn => {
        if (btn.getAttribute('data-cat') === cat) {
          btn.className = "cat-chip px-3 py-1.5 rounded-full font-medium transition bg-orange-500 text-white";
        } else {
          btn.className = "cat-chip px-3 py-1.5 rounded-full font-medium transition bg-slate-800 text-slate-300 border border-slate-700 hover:text-white";
        }
      });
      renderCards();
    }

    function handleSearch(val) {
      searchQuery = val;
      renderCards();
    }

    function toggleBookmarkFilter() {
      showOnlyBookmarks = !showOnlyBookmarks;
      const btn = document.getElementById('bookmark-filter-btn');
      if (showOnlyBookmarks) {
        btn.className = "ml-auto px-3 py-1.5 rounded-full font-medium transition bg-amber-500 text-slate-900 font-bold flex items-center gap-1";
      } else {
        btn.className = "ml-auto px-3 py-1.5 rounded-full font-medium transition bg-slate-800 text-slate-300 border border-slate-700 hover:text-white flex items-center gap-1";
      }
      renderCards();
    }

    // Theme Toggle
    function toggleTheme() {
      const html = document.documentElement;
      const isDark = html.classList.toggle('dark');
      document.getElementById('theme-icon').textContent = isDark ? '🌙' : '☀️';
      if (!isDark) {
        document.body.classList.remove('bg-slate-900', 'text-slate-100');
        document.body.classList.add('bg-slate-50', 'text-slate-800');
      } else {
        document.body.classList.remove('bg-slate-50', 'text-slate-800');
        document.body.classList.add('bg-slate-900', 'text-slate-100');
      }
    }

    // PWA Service Worker Registration
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(console.error);
      });
    }

    // PWA Install Prompt Handler
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById('pwa-banner').classList.remove('hidden');
    });

    function installPwa() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(() => {
          deferredPrompt = null;
          dismissPwaBanner();
        });
      }
    }

    function dismissPwaBanner() {
      document.getElementById('pwa-banner').classList.add('hidden');
    }

    // Start
    fetchFeeds();
  </script>
</body>
</html>
