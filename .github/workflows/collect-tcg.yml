name: Collect TCG Card Images

# digimoncard.io 카드 목록으로 도감 디지몬별 대표 TCG 카드 이미지 매핑 (data/tcg/cards.json)
on:
  workflow_dispatch:
  schedule:
    - cron: '53 3 * * 4'  # 매주 목요일

permissions:
  contents: write

concurrency:
  group: collect-tcg
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r scraper/requirements.txt
      - name: Collect TCG cards
        run: python scraper/collect_tcg.py
      - name: Rebuild dex data
        run: python scraper/build_dex.py
      - name: Commit if changed
        run: |
          git config --global user.name "DigiBot"
          git config --global user.email "digibot@users.noreply.github.com"
          git add data/tcg public/data/dex.json docs/data/dex.json public/data/evo docs/data/evo data/official/match_report.md data/official/ex_numbers.json
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "chore(tcg): update TCG card images [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
