name: Digimon Auto Search & Scrape

on:
  schedule:
    # 매 1시간마다 자동 실행 (UTC 기준)
    - cron: '0 * * * *'
  workflow_dispatch: # GitHub 웹 UI에서 수동 실행 버튼 지원

permissions:
  contents: write

# 이전 실행이 길어져도 겹치지 않게 (진행 중인 실행은 끝까지 두고 다음 실행은 대기)
concurrency:
  group: scrape-feeds
  cancel-in-progress: false

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scraper/requirements.txt

      - name: Run Crawler
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: |
          python scraper/crawl.py

      - name: Commit and push if data changed
        run: |
          git config --global user.name "DigiBot"
          git config --global user.email "digibot@users.noreply.github.com"
          git add data/digimon_feeds.json docs/digimon_feeds.json public/digimon_feeds.json
          git add data/translations 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No changes in feeds data."
          else
            git commit -m "chore(feeds): auto update digimon feeds [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
