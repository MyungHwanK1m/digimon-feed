name: Collect Official Reference

on:
  workflow_dispatch:
  schedule:
    # 매주 화요일 03:23 UTC (공식 신규 디지몬 반영)
    - cron: '23 3 * * 2'
  push: # (임시) 작업 브랜치에서 첫 수집 실행
    branches: [claude/tender-davinci-dcqvn9]
    paths: ['scraper/collect_official.py', '.github/workflows/collect-official.yml']

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -r scraper/requirements.txt
      - name: Collect official reference (basic info only)
        run: python scraper/collect_official.py
      - name: Commit if changed
        run: |
          git config --global user.name "DigiBot"
          git config --global user.email "digibot@users.noreply.github.com"
          git add data/official
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "chore(official): update official reference basic info [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
