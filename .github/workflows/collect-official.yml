name: Collect Official Reference

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'full | list-only | appmon-only'
        default: 'full'
  schedule:
    # 매주 화요일 03:23 UTC (공식 신규 디지몬 반영)
    - cron: '23 3 * * 2'

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r scraper/requirements.txt
      - name: Collect official reference (basic info only)
        env:
          MODE: ${{ inputs.mode }}
        run: |
          case "$MODE" in
            list-only) python scraper/collect_official.py --list-only ;;
            appmon-only) python scraper/collect_official.py --appmon-only ;;
            ''|full) python scraper/collect_official.py ;;
            *) echo "Unknown mode: $MODE"; exit 1 ;;
          esac
      - name: Rebuild dex data
        run: python scraper/build_dex.py

      - name: Commit if changed
        run: |
          git config --global user.name "DigiBot"
          git config --global user.email "digibot@users.noreply.github.com"
          git add data/official public/data/dex.json docs/data/dex.json public/data/evo docs/data/evo
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "chore(official): update official reference basic info [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
