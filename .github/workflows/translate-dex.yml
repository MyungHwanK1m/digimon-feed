name: Translate Dex Descriptions

# Digi-API 영어 도감 설명을 Gemini로 미리 한국어 번역 (저장소 Secrets 에 GEMINI_API_KEY 필요)
# 무료 등급 한도·혼잡에 걸리면 저장 후 멈추고 다음 실행 때 이어서 진행
on:
  workflow_dispatch:
    inputs:
      recheck:
        description: '번역된 것도 원문 변경 확인'
        type: boolean
        default: false
      max:
        description: '이번 실행 최대 번역 수 (비우면 전부)'
        type: string
        default: ''
  schedule:
    - cron: '41 */4 * * *'  # 4시간마다, 안 된 것만 (다 끝나면 금방 종료)

permissions:
  contents: write

concurrency:
  group: translate-dex
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r scraper/requirements.txt
      - name: Translate (only untranslated entries)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          RECHECK: ${{ inputs.recheck }}
          MAX: ${{ inputs.max }}
        run: |
          args=()
          if [ "$RECHECK" = "true" ]; then args+=(--recheck); fi
          if [ -n "$MAX" ]; then
            case "$MAX" in *[!0-9]*) echo "max must be a number"; exit 1 ;; esac
            args+=(--max "$MAX")
          fi
          python scraper/translate_dex.py "${args[@]}"
      - name: Commit if changed
        run: |
          git config --global user.name "DigiBot"
          git config --global user.email "digibot@users.noreply.github.com"
          git add data/translations public/data/dex_ko docs/data/dex_ko 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "chore(dex): pre-translated descriptions [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push
          fi
