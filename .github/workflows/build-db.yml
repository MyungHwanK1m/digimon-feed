name: Build Digi-Dex DB

on:
  push:
    branches: [main]
    paths:
      - 'data/digidex_db.yaml'
      - 'scraper/build_db.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-db:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Validate and build DB (fails on unknown Digimon names)
        run: python scraper/build_db.py

      - name: Commit and push if outputs changed
        run: |
          git config --global user.name "DigiBot"
          git config --global user.email "digibot@users.noreply.github.com"
          git add public/data/digidex_db.json docs/data/digidex_db.json EVOLUTION.md
          if git diff --staged --quiet; then
            echo "DB outputs are up to date."
          else
            git commit -m "chore(db): rebuild digidex DB and diagrams [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
